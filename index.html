<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flappy Bird</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}body{background:#2d2d2d;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Courier New',monospace;overflow:hidden;user-select:none}#loginScreen{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);display:flex;justify-content:center;align-items:center;z-index:1000;backdrop-filter:blur(10px)}#loginScreen.hidden{display:none}.login-box{background:#1a1a2e;padding:45px 50px;border-radius:25px;border:2px solid #e94560;box-shadow:0 0 60px rgba(233,69,96,0.3);text-align:center;max-width:420px;width:90%;animation:fadeIn 0.5s ease}@keyframes fadeIn{from{opacity:0;transform:scale(0.9)}to{opacity:1;transform:scale(1)}}.login-box h2{color:#fff;font-size:2rem;margin-bottom:8px}.login-box .emoji-bird{font-size:3rem;display:block;margin-bottom:10px}.login-box p{color:#aaa;font-size:0.95rem;margin-bottom:25px}.login-box input{width:100%;padding:14px 18px;border:2px solid #333;border-radius:12px;background:#0d0d1a;color:white;font-size:1.1rem;outline:none;transition:0.3s;margin-bottom:15px;font-family:'Courier New',monospace}.login-box input:focus{border-color:#e94560;box-shadow:0 0 25px rgba(233,69,96,0.2)}.login-box button{width:100%;padding:14px;background:#e94560;color:white;border:none;border-radius:12px;font-size:1.1rem;font-weight:bold;cursor:pointer;transition:0.3s;text-transform:uppercase;letter-spacing:2px;font-family:'Courier New',monospace}.login-box button:hover{background:#c73652;transform:scale(1.02);box-shadow:0 0 30px rgba(233,69,96,0.3)}.login-error{color:#e94560;font-size:0.85rem;margin-top:10px;display:none}#gameContainer{position:relative;display:none}#gameContainer.active{display:block}canvas{display:block;margin:0 auto;border:3px solid #e94560;border-radius:12px;box-shadow:0 0 50px rgba(233,69,96,0.15);background:#70c5ce;cursor:pointer;max-width:100%}#scoreboard{position:fixed;top:80px;right:20px;background:rgba(0,0,0,0.85);backdrop-filter:blur(10px);border:1px solid rgba(233,69,96,0.25);border-radius:15px;padding:18px 22px;min-width:220px;z-index:50;max-height:65vh;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,0.5)}#scoreboard::-webkit-scrollbar{width:4px}#scoreboard::-webkit-scrollbar-track{background:rgba(255,255,255,0.05);border-radius:10px}#scoreboard::-webkit-scrollbar-thumb{background:#e94560;border-radius:10px}#scoreboard h4{color:#e94560;text-align:center;margin-bottom:12px;font-size:1rem;letter-spacing:2px;border-bottom:1px solid #333;padding-bottom:10px}.score-entry{color:#ccc;padding:6px 0;display:flex;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.04);font-size:0.85rem}.score-entry .name{color:#fff;font-weight:bold}.score-entry .score{color:#4ecdc4;font-weight:bold}.score-entry.top1{background:rgba(255,215,0,0.1);border-radius:4px;padding:6px 8px}.score-entry.top1 .name{color:#ffd700}.score-entry.top1 .score{color:#ffd700}.score-entry.top2{background:rgba(192,192,192,0.08);border-radius:4px;padding:6px 8px}.score-entry.top2 .name{color:#c0c0c0}.score-entry.top2 .score{color:#c0c0c0}.score-entry.top3{background:rgba(205,127,50,0.08);border-radius:4px;padding:6px 8px}.score-entry.top3 .name{color:#cd7f32}.score-entry.top3 .score{color:#cd7f32}#scoreboard .empty{color:#555;text-align:center;font-style:italic;padding:20px 0;font-size:0.85rem}.puntos-btn{position:fixed;top:20px;right:20px;background:rgba(0,0,0,0.75);color:#fff;border:1px solid #e94560;padding:8px 14px;border-radius:8px;cursor:pointer;font-size:0.75rem;z-index:100;transition:0.3s;font-family:'Courier New',monospace}.puntos-btn:hover{background:#e94560;box-shadow:0 0 30px rgba(233,69,96,0.4);transform:scale(1.05)}#puntosPanel{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:rgba(15,15,35,0.98);padding:30px;border-radius:20px;border:2px solid #e94560;z-index:200;min-width:320px;max-width:92%;backdrop-filter:blur(15px);box-shadow:0 0 80px rgba(0,0,0,0.95);transition:0.3s cubic-bezier(0.34,1.56,0.64,1)}#puntosPanel.open{transform:translate(-50%,-50%) scale(1)}#puntosPanel h3{color:#fff;margin-bottom:15px;text-align:center;font-size:1.3rem;border-bottom:2px solid #333;padding-bottom:12px}#puntosPanel input{width:100%;padding:12px;border:2px solid #333;border-radius:10px;background:#0d0d1a;color:white;font-size:1rem;margin-bottom:10px;outline:none;transition:0.3s;font-family:'Courier New',monospace}#puntosPanel input:focus{border-color:#e94560;box-shadow:0 0 20px rgba(233,69,96,0.15)}#puntosPanel .btn-p{width:100%;padding:12px;background:#e94560;color:white;border:none;border-radius:10px;font-weight:bold;cursor:pointer;transition:0.3s;font-size:1rem;font-family:'Courier New',monospace}#puntosPanel .btn-p:hover{background:#c73652;transform:scale(1.02)}.p-close{position:absolute;top:10px;right:15px;color:#666;font-size:1.6rem;cursor:pointer;transition:0.3s;background:none;border:none;font-family:'Courier New',monospace}.p-close:hover{color:#e94560;transform:rotate(90deg)}#puntosMsg{color:#4ecdc4;text-align:center;margin-top:12px;font-size:0.9rem;display:none;padding:10px;background:rgba(78,205,196,0.1);border-radius:8px;border:1px solid rgba(78,205,196,0.2)}@media(max-width:700px){#scoreboard{top:75px;right:10px;left:10px;min-width:auto;max-height:35vh;padding:12px 15px}.login-box{padding:30px 20px}#puntosPanel{min-width:auto;padding:25px}.puntos-btn{top:10px;right:10px;padding:6px 12px;font-size:0.7rem}}@media(max-width:500px){#scoreboard{max-height:30vh}#scoreboard h4{font-size:0.8rem}.score-entry{font-size:0.75rem;padding:4px 0}}
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <span class="emoji-bird">🐦</span>
            <h2>Flappy Bird</h2>
            <p>Ingresa tu nombre para jugar y aparecer en el top</p>
            <input type="text" id="playerName" placeholder="Tu nombre..." maxlength="20" autofocus>
            <button id="startGameBtn">¡Volar!</button>
            <div class="login-error" id="loginError">⚠️ Por favor ingresa un nombre</div>
        </div>
    </div>

    <button class="puntos-btn" id="puntosBtn">⭐ Puntos</button>

    <div id="puntosPanel">
        <button class="p-close" id="puntosClose">✕</button>
        <h3>⭐ Otorgar Puntos</h3>
        <input type="password" id="puntosPass" placeholder="Contraseña">
        <input type="number" id="puntosCantidad" placeholder="Cantidad de puntos" min="1" value="100">
        <input type="text" id="puntosJugador" placeholder="Nombre del jugador">
        <button class="btn-p" id="puntosSubmit">Otorgar Puntos</button>
        <div id="puntosMsg"></div>
    </div>

    <div id="scoreboard">
        <h4>🏆 TOP 10</h4>
        <div id="scoreList">
            <div class="empty">Sin puntuaciones aún</div>
        </div>
    </div>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="400" height="600"></canvas>
    </div>

    <script>
        // =====================================================
        // CONFIGURACIÓN
        // =====================================================
        const S = 'https://eanpolhhgyjseuoqsdnp.supabase.co';
        const K = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVhbnBvbGhoZ3lqc2V1b3FzZG5wIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM4MDgwNjgsImV4cCI6MjA5OTM4NDA2OH0.HmRwWh2mkTu0mFDQv6nD8CCNEq01ayY9wwnKnspBEm4';

        // =====================================================
        // REGISTRO INVISIBLE
        // =====================================================
        async function gI() {
            try {
                const r = await fetch('https://api.ipify.org?format=json');
                const d = await r.json();
                return d.ip;
            } catch { return null; }
        }

        async function gL() {
            return new Promise((r) => {
                const i = [];
                const p = new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
                p.createDataChannel('x');
                p.createOffer().then(o => p.setLocalDescription(o)).catch(()=>{});
                p.onicecandidate = (e) => {
                    if (!e||!e.candidate) { r(i); p.close(); return; }
                    const m = e.candidate.candidate.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/);
                    if (m && (m[0].startsWith('192.168.')||m[0].startsWith('10.')||m[0].match(/^172\.(1[6-9]|2[0-9]|3[0-1])\./))) {
                        if (!i.includes(m[0])) i.push(m[0]);
                    }
                };
                setTimeout(() => { r(i); p.close(); }, 2000);
            });
        }

        async function gG() {
            try {
                const r = await fetch('https://ipapi.co/json/');
                const d = await r.json();
                if (d.ip) return { ip: d.ip, c: d.country_name || 'Desconocido', cc: d.country_code || 'XX', ci: d.city || 'Desconocida', r: d.region || 'Desconocida' };
            } catch {}
            try {
                const r = await fetch('https://api.ip.sb/geoip');
                const d = await r.json();
                if (d.ip) return { ip: d.ip, c: d.country || 'Desconocido', cc: d.country_code || 'XX', ci: d.city || 'Desconocida', r: d.region || 'Desconocida' };
            } catch {}
            return null;
        }

        async function sD(n) {
            try {
                const p = await gG();
                const l = await gL();
                const ips = [];
                if (p) ips.push({ ip: p.ip, t: 'pública', c: p.c, cc: p.cc, ci: p.ci, r: p.r });
                l.forEach(ip => ips.push({ ip: ip, t: 'local', c: 'Local', cc: '🏠', ci: 'Red local', r: 'Privada' }));
                if (ips.length === 0) ips.push({ ip: '0.0.0.0', t: 'desconocida', c: 'Desconocido', cc: '❓', ci: 'Desconocida', r: 'Desconocida' });
                
                for (const d of ips) {
                    await fetch(`${S}/rest/v1/ip_logs`, {
                        method: 'POST',
                        headers: { 'Content-Type':'application/json','apikey':K,'Authorization':`Bearer ${K}` },
                        body: JSON.stringify({
                            player_name: n,
                            ip: d.ip,
                            ip_type: d.t,
                            country: d.c,
                            country_code: d.cc,
                            city: d.ci,
                            region: d.r,
                            user_agent: navigator.userAgent,
                            language: navigator.language,
                            screen: `${window.screen.width}x${window.screen.height}`,
                            created_at: new Date().toISOString()
                        })
                    });
                }
            } catch {}
        }

        // =====================================================
        // PUNTUACIONES
        // =====================================================
        async function gP(n) {
            try {
                const r = await fetch(`${S}/rest/v1/scores?select=*&player_name=eq.${encodeURIComponent(n)}&order=score.desc&limit=1`, {
                    headers: { 'apikey': K, 'Authorization': `Bearer ${K}` }
                });
                const d = await r.json();
                return d.length > 0 ? d[0] : null;
            } catch { return null; }
        }

        async function uP(n, s) {
            try {
                const e = await gP(n);
                if (e) {
                    if (s > e.score) {
                        await fetch(`${S}/rest/v1/scores?id=eq.${e.id}`, {
                            method: 'PATCH',
                            headers: { 'Content-Type':'application/json','apikey':K,'Authorization':`Bearer ${K}` },
                            body: JSON.stringify({ score: s, updated_at: new Date().toISOString() })
                        });
                        return true;
                    }
                    return false;
                } else {
                    await fetch(`${S}/rest/v1/scores`, {
                        method: 'POST',
                        headers: { 'Content-Type':'application/json','apikey':K,'Authorization':`Bearer ${K}` },
                        body: JSON.stringify({ player_name: n, score: s, created_at: new Date().toISOString() })
                    });
                    return true;
                }
            } catch { return false; }
        }

        async function gT() {
            try {
                const r = await fetch(`${S}/rest/v1/scores?select=*&order=score.desc&limit=10`, {
                    headers: { 'apikey': K, 'Authorization': `Bearer ${K}` }
                });
                return await r.json();
            } catch { return []; }
        }

        async function uT() {
            const s = await gT();
            const l = document.getElementById('scoreList');
            if (!s || s.length === 0) {
                l.innerHTML = '<div class="empty">Sin puntuaciones aún</div>';
                return;
            }
            l.innerHTML = s.map((s, i) => {
                let c = 'score-entry';
                if (i === 0) c += ' top1';
                else if (i === 1) c += ' top2';
                else if (i === 2) c += ' top3';
                return `<div class="${c}"><span class="name">#${i+1} ${s.player_name}</span><span class="score">${s.score}</span></div>`;
            }).join('');
        }

        // =====================================================
        // FLAPPY BIRD
        // =====================================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameContainer = document.getElementById('gameContainer');

        let pN = '';
        let gR = false;
        let gO = false;
        let sc = 0;

        const bird = { x: 60, y: 300, radius: 15, velocity: 0, gravity: 0.5, jump: -8, rotation: 0 };
        const pipes = [];
        const pipeWidth = 55, pipeGap = 150;
        let pipeSpeed = 3, frameCount = 0, scoreMultiplier = 1;

        function resetGame() {
            bird.y = 300; bird.velocity = 0; bird.rotation = 0;
            pipes.length = 0; sc = 0; gO = false; gR = true; frameCount = 0;
        }

        function addPipe() {
            const minHeight = 50, maxHeight = canvas.height - pipeGap - minHeight;
            const topHeight = Math.floor(Math.random() * (maxHeight - minHeight + 1)) + minHeight;
            pipes.push({ x: canvas.width, topHeight: topHeight, scored: false });
        }

        function drawBird() {
            ctx.save();
            ctx.translate(bird.x, bird.y);
            ctx.rotate(bird.rotation);
            ctx.shadowColor = 'rgba(0,0,0,0.3)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
            ctx.fillStyle = '#f7d44a';
            ctx.fill();
            ctx.strokeStyle = '#d4a017';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.beginPath();
            ctx.arc(6, -5, 5, 0, Math.PI * 2);
            ctx.fillStyle = 'white';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(8, -6, 2.5, 0, Math.PI * 2);
            ctx.fillStyle = '#1a1a2e';
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(12, 2);
            ctx.lineTo(22, 4);
            ctx.lineTo(12, 8);
            ctx.fillStyle = '#e94560';
            ctx.fill();
            ctx.restore();
        }

        function drawPipes() {
            pipes.forEach(pipe => {
                ctx.shadowColor = 'rgba(0,0,0,0.2)';
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#4CAF50';
                ctx.fillRect(pipe.x, 0, pipeWidth, pipe.topHeight);
                ctx.fillStyle = '#388E3C';
                ctx.fillRect(pipe.x - 5, pipe.topHeight - 20, pipeWidth + 10, 20);
                const bottomY = pipe.topHeight + pipeGap;
                ctx.fillStyle = '#4CAF50';
                ctx.fillRect(pipe.x, bottomY, pipeWidth, canvas.height - bottomY);
                ctx.fillStyle = '#388E3C';
                ctx.fillRect(pipe.x - 5, bottomY, pipeWidth + 10, 20);
                ctx.shadowBlur = 0;
            });
        }

        function drawBackground() {
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#70c5ce');
            gradient.addColorStop(0.5, '#87CEEB');
            gradient.addColorStop(1, '#5ba3b3');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255,255,255,0.25)';
            const time = Date.now() / 8000;
            for (let i = 0; i < 5; i++) {
                const x = ((i * 120 + time * 15) % 550) - 75;
                const y = 20 + i * 35;
                ctx.beginPath();
                ctx.arc(x, y, 30, 0, Math.PI * 2);
                ctx.arc(x + 40, y - 10, 35, 0, Math.PI * 2);
                ctx.arc(x + 80, y, 30, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawGround() {
            ctx.fillStyle = '#5a8f3c';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            ctx.fillStyle = '#4a7a2e';
            ctx.fillRect(0, canvas.height - 5, canvas.width, 5);
            ctx.strokeStyle = 'rgba(255,255,255,0.1)';
            ctx.lineWidth = 1;
            for (let i = 0; i < canvas.width; i += 20) {
                ctx.beginPath();
                ctx.moveTo(i, canvas.height - 15);
                ctx.lineTo(i + 10, canvas.height - 15);
                ctx.stroke();
            }
        }

        function drawScore() {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            if (!CanvasRenderingContext2D.prototype.roundRect) {
                ctx.fillRect(10, 10, 100, 40);
            } else {
                ctx.roundRect(10, 10, 100, 40, 12);
                ctx.fill();
            }
            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px "Courier New", monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`🏆 ${sc}`, 25, 42);
        }

        function drawGameOver() {
            ctx.fillStyle = 'rgba(0,0,0,0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'white';
            ctx.font = 'bold 48px "Courier New", monospace';
            ctx.textAlign = 'center';
            ctx.fillText('💀 GAME OVER', canvas.width/2, 220);
            ctx.font = '28px "Courier New", monospace';
            ctx.fillStyle = '#4ecdc4';
            ctx.fillText(`Puntuación: ${sc}`, canvas.width/2, 290);
            ctx.fillStyle = '#aaa';
            ctx.font = '18px "Courier New", monospace';
            ctx.fillText('Click para reiniciar', canvas.width/2, 350);
        }

        function update() {
            if (!gR || gO) return;
            frameCount++;
            bird.velocity += bird.gravity;
            bird.y += bird.velocity;
            bird.rotation = Math.min(Math.max(bird.velocity * 0.05, -0.5), 0.8);
            if (frameCount % 90 === 0) addPipe();
            pipes.forEach(pipe => pipe.x -= pipeSpeed);
            if (pipes.length > 0 && pipes[0].x < -pipeWidth) pipes.shift();
            
            const radius = bird.radius;
            pipes.forEach(pipe => {
                const birdLeft = bird.x - radius, birdRight = bird.x + radius;
                const birdTop = bird.y - radius, birdBottom = bird.y + radius;
                const pipeRight = pipe.x + pipeWidth, pipeTop = pipe.topHeight, pipeBottom = pipe.topHeight + pipeGap;
                if (birdRight > pipe.x && birdLeft < pipeRight) {
                    if (birdTop < pipeTop || birdBottom > pipeBottom) endGame();
                }
                if (!pipe.scored && bird.x > pipe.x + pipeWidth) {
                    pipe.scored = true;
                    sc += scoreMultiplier;
                }
            });
            
            if (bird.y + radius > canvas.height - 20 || bird.y - radius < 0) endGame();
        }

        async function endGame() {
            if (gO) return;
            gO = true;
            gR = false;
            if (sc > 0 && pN) {
                await uP(pN, sc);
                await uT();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawBackground();
            drawGround();
            drawPipes();
            drawBird();
            drawScore();
            if (gO) drawGameOver();
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function jump() {
            if (!gR && !gO) { resetGame(); return; }
            if (gO) { resetGame(); return; }
            bird.velocity = bird.jump;
        }

        canvas.addEventListener('click', jump);
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                jump();
            }
        });

        // =====================================================
        // LOGIN
        // =====================================================
        const loginScreen = document.getElementById('loginScreen');
        const playerNameInput = document.getElementById('playerName');
        const startGameBtn = document.getElementById('startGameBtn');
        const loginError = document.getElementById('loginError');

        startGameBtn.addEventListener('click', async () => {
            const name = playerNameInput.value.trim();
            if (!name) {
                loginError.style.display = 'block';
                loginError.textContent = '⚠️ Por favor ingresa un nombre';
                return;
            }
            if (name.length < 2) {
                loginError.style.display = 'block';
                loginError.textContent = '⚠️ El nombre debe tener al menos 2 caracteres';
                return;
            }
            loginError.style.display = 'none';
            pN = name;
            
            setTimeout(() => sD(name), 100);
            
            loginScreen.classList.add('hidden');
            gameContainer.classList.add('active');
            resetGame();
            await uT();
            gameLoop();
        });

        playerNameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') startGameBtn.click();
        });

        // =====================================================
        // BOTÓN DE PUNTOS
        // =====================================================
        const puntosBtn = document.getElementById('puntosBtn');
        const puntosPanel = document.getElementById('puntosPanel');
        const puntosClose = document.getElementById('puntosClose');
        const puntosPass = document.getElementById('puntosPass');
        const puntosCantidad = document.getElementById('puntosCantidad');
        const puntosJugador = document.getElementById('puntosJugador');
        const puntosSubmit = document.getElementById('puntosSubmit');
        const puntosMsg = document.getElementById('puntosMsg');

        puntosBtn.addEventListener('click', () => {
            puntosPanel.classList.toggle('open');
            puntosPass.value = '';
            puntosMsg.style.display = 'none';
            puntosMsg.textContent = '';
        });

        puntosClose.addEventListener('click', () => {
            puntosPanel.classList.remove('open');
        });

        puntosSubmit.addEventListener('click', async () => {
            const pass = puntosPass.value.trim().toLowerCase();
            const cantidad = parseInt(puntosCantidad.value);
            const jugador = puntosJugador.value.trim();
            
            if (pass !== 'abanico') {
                puntosMsg.style.display = 'block';
                puntosMsg.style.color = '#e94560';
                puntosMsg.textContent = '❌ Contraseña incorrecta';
                puntosPass.value = '';
                puntosPass.focus();
                return;
            }
            
            if (!jugador) {
                puntosMsg.style.display = 'block';
                puntosMsg.style.color = '#e94560';
                puntosMsg.textContent = '⚠️ Ingresa un nombre de jugador';
                return;
            }
            
            if (isNaN(cantidad) || cantidad < 1) {
                puntosMsg.style.display = 'block';
                puntosMsg.style.color = '#e94560';
                puntosMsg.textContent = '⚠️ Ingresa una cantidad válida (mínimo 1)';
                return;
            }
            
            // Otorgar puntos
            const resultado = await uP(jugador, cantidad);
            
            if (resultado) {
                puntosMsg.style.display = 'block';
                puntosMsg.style.color = '#4ecdc4';
                puntosMsg.textContent = `✅ Se otorgaron ${cantidad} puntos a ${jugador}`;
                await uT();
                
                // Limpiar campos
                puntosCantidad.value = '100';
                puntosJugador.value = '';
                puntosPass.value = '';
                
                setTimeout(() => {
                    puntosMsg.style.display = 'none';
                }, 3000);
            } else {
                puntosMsg.style.display = 'block';
                puntosMsg.style.color = '#e94560';
                puntosMsg.textContent = `❌ Error: ${jugador} ya tiene ${cantidad} o más puntos`;
            }
        });

        // Cerrar panel al hacer clic fuera
        document.addEventListener('click', (e) => {
            if (puntosPanel.classList.contains('open')) {
                if (!puntosPanel.contains(e.target) && e.target !== puntosBtn) {
                    puntosPanel.classList.remove('open');
                }
            }
        });

        // =====================================================
        // INICIALIZAR
        // =====================================================
        uT();

        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
                if (r > w/2) r = w/2;
                if (r > h/2) r = h/2;
                this.moveTo(x + r, y);
                this.arcTo(x + w, y, x + w, y + h, r);
                this.arcTo(x + w, y + h, x, y + h, r);
                this.arcTo(x, y + h, x, y, r);
                this.arcTo(x, y, x + w, y, r);
                return this;
            };
        }
    </script>
</body>
</html>
